<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SearchBlox Widget Preview</title>
  <link rel="stylesheet" href="../widgets/searchblox-search/searchblox-search.css">
  <style>
    /* Everything here is the demo page, not the widget. ?theme=dark mimics a dark
       AEM theme: the widgets should adapt with no config. */
    :root { --page-bg: #fff; --page-text: #131313; --muted: #5c5c5c; --line: #d4d4d8; --header-bg: #f4f4f5; --bar-bg: #22104a; --bar-text: #e4e4e7; --link: #6d28d9; }
    body.dark { --page-bg: #000; --page-text: #fff; --muted: #a1a1aa; --line: #3f3f46; --header-bg: #111113; --link: #ccb5ff; }
    body { margin: 0; background: var(--page-bg); color: var(--page-text); font-family: system-ui, sans-serif; }
    a { color: var(--link); }
    code { font-size: 0.85em; }

    /* Demo controls, outside the mock site. */
    .demo-bar { padding: 10px 16px; background: var(--bar-bg); color: var(--bar-text); font-size: 0.875rem; }
    .demo-bar-inner { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; max-width: 1100px; margin: 0 auto; }
    .demo-bar img { display: block; height: 40px; width: auto; }
    .demo-bar-title { color: #c9b8f5; }
    .demo-switches { display: flex; gap: 20px; margin-left: auto; }
    .demo-switch { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
    .demo-switch input { position: relative; width: 34px; height: 20px; margin: 0; border-radius: 10px; background: rgb(255 255 255 / 25%); appearance: none; cursor: pointer; transition: background 0.2s; }
    .demo-switch input::before { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; content: ''; transition: translate 0.2s; }
    .demo-switch input:checked { background: #8b5cf6; }
    .demo-switch input:checked::before { translate: 14px 0; }
    .demo-switch input:focus-visible { outline: 2px solid #c4b5fd; outline-offset: 2px; }

    /* Mock host site. */
    .site-header { border-bottom: 1px solid var(--line); background: var(--header-bg); }
    .site-header-inner { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-start; max-width: 1100px; margin: 0 auto; padding: 16px; }
    .site-logo { padding-top: 10px; font-weight: 700; }
    .site-nav { display: flex; gap: 16px; padding-top: 10px; color: var(--muted); font-size: 0.9rem; }
    .site-header .demo-widget { flex: 1 1 360px; max-width: 480px; margin-left: auto; }
    .site-main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 96px; }
    .site-main h1 { margin: 0 0 16px; font-size: 1.6rem; }

    /* Each widget instance: a label above, and a dashed border around the widget
       element itself, so only the widget is inside it. */
    .demo-widget > .header-search,
    .demo-widget > .results-search { padding: 12px; border: 1px dashed var(--muted); border-radius: 10px; }
    .demo-widget-label { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; margin-bottom: 8px; color: var(--muted); font-size: 0.75rem; }
    .demo-widget-label b { color: var(--page-text); font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="demo-bar">
    <div class="demo-bar-inner">
      <img src="searchblox-logo-white.png" alt="SearchBlox">
      <span class="demo-bar-title">Widget preview</span>
      <div class="demo-switches">
        <label class="demo-switch"><input type="checkbox" id="dark-toggle"> Dark mode</label>
        <label class="demo-switch"><input type="checkbox" id="ai-toggle"> AI features</label>
      </div>
    </div>
  </div>

  <header class="site-header">
    <div class="site-header-inner">
      <span class="site-logo">Example site</span>
      <nav class="site-nav" aria-label="Example site"><span>Home</span><span>Services</span><span>About</span></nav>
      <section class="demo-widget" aria-label="Widget 1">
        <div class="demo-widget-label"><b>Widget 1 · Header search box</b></div>
        <div class="header-search"
             data-domain="https://YOUR-SEARCHBLOX-SERVER"
             data-results-page="./index.html"
             data-voice-search="true"
             data-chat-suggestions="true"
             data-chat-references="true"></div>
      </section>
    </div>
  </header>

  <main class="site-main">
    <h1>Search</h1>
    <section class="demo-widget" aria-label="Widget 2">
      <div class="demo-widget-label"><b>Widget 2 · Results page</b></div>
      <div class="results-search"
           data-domain="https://YOUR-SEARCHBLOX-SERVER"
           data-facets="contenttype,topics,keywords,colname,lastmodified"
           data-page-size="10"
           data-recommendations="true"
           data-llm-fields="both"
           data-assist="true"
           data-voice-search="true"
           data-settings="true"></div>
    </section>
  </main>

  <script type="module">
    import { mount } from '../widgets/searchblox-search/searchblox-core.js';

    // ?domain=https://... overrides the data-domain placeholders. Without it, the
    // page's own origin is used, which is what demo/serve.mjs proxies to SearchBlox.
    const params = new URLSearchParams(window.location.search);
    const domain = params.get('domain');
    const dark = params.get('theme') === 'dark';
    // ?ai=off turns every AI feature off; otherwise they're on wherever configured.
    const aiOff = params.get('ai') === 'off';
    const AI_OFF = {
      aiOverview: '', chatbot: '', aiMode: '', recommendations: 'false', llmFields: 'off', assist: 'false',
    };

    // Widget options that can be tried from the demo URL, per widget.
    const shared = ['collections', 'accent', 'smartSuggest', 'analytics', 'settings', 'trending', 'voiceSearch', 'aiMode'];
    const widgets = [
      ['.header-search', 'header', [...shared, 'chatbot', 'chatSuggestions', 'chatReferences']],
      ['.results-search', 'results', [...shared, 'vectorWeight', 'aiOverview', 'recommendations', 'llmFields', 'assist', 'loadMore', 'topQueries', 'urlDisplay', 'featured']],
    ];

    // Options for your own server (collection IDs and names, chatbot, ...) live in
    // demo/demo.local.json, which git ignores: { "header": {...}, "results": {...} }.
    const local = await fetch('./demo.local.json').then((r) => (r.ok ? r.json() : {})).catch(() => ({}));

    // ?theme=dark switches the demo page (not the widgets) to a dark theme. The
    // switches reload the page with the setting, keeping the search.
    document.body.classList.toggle('dark', dark);
    const reloadWith = (name, value) => {
      const next = new URLSearchParams(window.location.search);
      if (value) next.set(name, value); else next.delete(name);
      window.location.search = next;
    };
    const darkToggle = document.getElementById('dark-toggle');
    darkToggle.checked = dark;
    darkToggle.addEventListener('change', () => reloadWith('theme', darkToggle.checked ? 'dark' : ''));
    const aiToggle = document.getElementById('ai-toggle');
    aiToggle.checked = !aiOff;
    aiToggle.addEventListener('change', () => reloadWith('ai', aiToggle.checked ? '' : 'off'));

    widgets.forEach(([selector, key, options]) => {
      const root = document.querySelector(selector);
      Object.entries(local[key] || {}).forEach(([name, value]) => { root.dataset[name] = `${value}`; });
      if (domain) root.dataset.domain = domain;
      else if (root.dataset.domain.includes('YOUR-SEARCHBLOX-SERVER')) root.dataset.domain = window.location.origin;
      options.forEach((name) => {
        if (params.has(name)) root.dataset[name] = params.get(name);
      });
      if (aiOff) Object.assign(root.dataset, AI_OFF);
      mount(root, { ...root.dataset });
    });
  </script>
</body>
</html>
